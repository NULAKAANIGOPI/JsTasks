<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shopping Store</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        /* Header */

        header {
            background: linear-gradient(135deg, #1e2e3e, #34495e);
            color: white;
            text-align: center;
            padding: 35px 20px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        header p {
            font-size: 15px;
            color: #dce3ea;
        }

        /* Main Section */

        .main {
            text-align: center;
            padding: 35px 20px 15px;
        }

        .main h2 {
            font-size: 27px;
            color: #263746;
            margin-bottom: 22px;
        }

        /* Show Product Button */

        #showBtn {
            background: linear-gradient(135deg, #ffbd2e, #ff9800);
            color: #222;
            padding: 13px 35px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: 0.3s ease;
            box-shadow: 0 4px 10px rgba(255, 152, 0, 0.25);
        }

        #showBtn:hover {
            background: #e68a00;
            transform: translateY(-3px);
        }

        /* Status */

        #status {
            text-align: center;
            margin: 15px;
            color: #34495e;
            font-size: 15px;
        }

        /* Product Container */

        .product-container {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 25px;
            max-width: 1400px;
            padding: 25px;
            margin: auto;
        }

        /* Product Card */

        .product-card {
            background: white;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: 0.3s ease;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 0;
        }

        .product-card:hover {
            transform: translateY(-7px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.14);
        }

        /* Product Image */

        .product-card img {
            width: 100%;
            height: 190px;
            object-fit: contain;
            margin-bottom: 18px;
            transition: 0.3s ease;
        }

        .product-card:hover img {
            transform: scale(1.05);
        }

        /* Product Title */

        .product-card .title,
        .product-card h3 {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.5;
            height: 65px;
            overflow: hidden;
            margin-bottom: 12px;
            color: #263746;
        }

        /* Rating */

        .product-card .rating {
            color: #e69b00;
            font-size: 14px;
            margin-bottom: 12px;
        }

        /* Price */

        .product-card .price {
            color: #168447;
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        /* Buy Button */

        .buy-btn {
            background: #ff9800;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            border-radius: 7px;
            transition: 0.3s ease;
        }

        .buy-btn:hover {
            background: #e68900;
            transform: scale(1.02);
        }
    </style>
</head>

<body>

    <header>
        <h1>My Shopping Store</h1>
        <p>Explore Our Latest Products</p>
    </header>

    <div class="main">
        <h2>All Products</h2>
        <button onclick="fetchcallback()" id="showBtn"> Show Products</button>
    </div>
    <p id="status"></p>
    <div id="output" class="product-container"></div>

    <script src="asyncfetch.js"></script>

</body>

</html>
